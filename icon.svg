<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="asi – Bergzeichen">
  <!-- Skisim / asi App-Icon: rekonstruiertes Bergzeichen (Berge + Sonne), ohne Schriftzug.
       Vollflächiger Hintergrund + Motiv in der maskable-Sicherheitszone (zentriert, ~80%). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB8DA"/>
      <stop offset="1" stop-color="#6E9EC7"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E74A8"/>
      <stop offset="1" stop-color="#2C5680"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund (voll, damit das Icon auch maskable/rund gecroppt funktioniert) -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sonne oben rechts, innerhalb der Sicherheitszone -->
  <circle cx="360" cy="150" r="46" fill="#F4B740"/>
  <circle cx="360" cy="150" r="46" fill="none" stroke="#F4B740" stroke-opacity="0.35" stroke-width="18"/>

  <!-- Hintere Bergkette -->
  <path d="M 96 372 L 214 196 L 300 300 L 360 232 L 416 372 Z" fill="url(#mtnBack)"/>
  <!-- Vordere Bergkette mit Schneekappen -->
  <path d="M 72 372 L 190 214 L 268 316 L 330 246 L 440 372 Z" fill="url(#mtnFront)"/>
  <!-- Schneekappen (weiße Spitzen) -->
  <path d="M 190 214 L 168 244 L 182 238 L 196 250 L 210 240 Z" fill="#FFFFFF"/>
  <path d="M 330 246 L 314 268 L 324 263 L 334 271 L 344 262 Z" fill="#FFFFFF"/>

  <!-- Grundlinie -->
  <rect x="72" y="372" width="368" height="14" rx="7" fill="#2C5680"/>
</svg>
